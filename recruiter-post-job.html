<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="recruiter-post-job.html">Post Job</a></li>
                <li><a href="login.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <section class="post-job-section">
        <h2>Post a Job</h2>

        <form id="postJobForm" class="post-job-form">
            <div class="form-group">
                <label for="jobTitle">Job Title:</label>
                <input type="text" id="jobTitle" name="jobTitle" required>
            </div>

            <div class="form-group">
                <label for="company">Company Name:</label>
                <input type="text" id="company" name="company" required>
            </div>

            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Required (in years):</label>
                <input type="number" id="experience" name="experience" required>
            </div>

            <div class="form-group">
                <label for="salary">Salary (per annum):</label>
                <input type="text" id="salary" name="salary" required>
            </div>

            <div class="form-group">
                <label for="jobDescription">Job Description:</label>
                <textarea id="jobDescription" name="jobDescription" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Post Job</button>
        </form>
    </section>

    <footer>
        <p>© 2024 Job Portal</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
